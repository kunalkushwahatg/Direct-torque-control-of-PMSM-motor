<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="900" viewBox="0 0 1000 900">
  <rect width="1000" height="900" fill="#ffffff"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#111111"/>
    </marker>
  </defs>

  <g font-family="Arial, Helvetica, sans-serif" fill="#111111">
    <!-- boxes -->
    <g fill="#ffffff" stroke="#111111" stroke-width="2">
      <rect x="330" y="40" width="340" height="70"/>
      <rect x="330" y="160" width="340" height="70"/>
      <rect x="330" y="300" width="340" height="70"/>
      <rect x="330" y="420" width="340" height="70"/>
      <rect x="330" y="540" width="340" height="70"/>
      <rect x="330" y="660" width="340" height="70"/>
      <rect x="330" y="780" width="340" height="80"/>
      <rect x="20" y="300" width="250" height="80"/>
    </g>

    <!-- labels -->
    <g font-size="24" text-anchor="middle">
      <text x="500" y="83">Line-speed reference</text>
      <text x="500" y="203">Tension PI</text>
      <text x="500" y="343">Speed PI</text>
      <text x="500" y="463">DTC / SVM-DTC</text>
      <text x="500" y="583">Inverter</text>
      <text x="500" y="703">PMSM</text>
      <text x="500" y="828">Winder / unwinder plant</text>
    </g>
    <g font-size="20" text-anchor="middle">
      <text x="145" y="335">Radius + inertia +</text>
      <text x="145" y="360">tension feedforward</text>
    </g>

    <!-- main signal flow -->
    <g stroke="#111111" stroke-width="2" fill="none">
      <line x1="500" y1="110" x2="500" y2="155" marker-end="url(#arrow)"/>
      <line x1="500" y1="230" x2="500" y2="295" marker-end="url(#arrow)"/>
      <line x1="500" y1="370" x2="500" y2="415" marker-end="url(#arrow)"/>
      <line x1="500" y1="490" x2="500" y2="535" marker-end="url(#arrow)"/>
      <line x1="500" y1="610" x2="500" y2="655" marker-end="url(#arrow)"/>
      <line x1="500" y1="730" x2="500" y2="775" marker-end="url(#arrow)"/>
      <line x1="270" y1="340" x2="325" y2="340" marker-end="url(#arrow)"/>
    </g>

    <!-- feedback -->
    <path d="M 670 820 H 880 V 195 H 675" fill="none" stroke="#111111" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="775" y="183" text-anchor="middle" font-size="18">Tension feedback</text>

    <!-- small annotation -->
    <text x="514" y="268" text-anchor="start" font-size="17" fill="#333333">speed reference</text>
  </g>
</svg>
