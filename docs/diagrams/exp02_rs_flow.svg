<svg xmlns="http://www.w3.org/2000/svg" width="800" height="620" viewBox="0 0 800 620">
  <rect width="800" height="620" fill="#ffffff"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#111111"/>
    </marker>
  </defs>
  <g font-family="Arial, Helvetica, sans-serif" fill="#111111">
    <rect x="220" y="40" width="360" height="70" fill="#ffffff" stroke="#111111" stroke-width="2"/>
    <g text-anchor="middle" font-size="19">
      <text x="400.0" y="81.7">Rs error</text>
    </g>
    <rect x="220" y="150" width="360" height="70" fill="#ffffff" stroke="#111111" stroke-width="2"/>
    <g text-anchor="middle" font-size="19">
      <text x="400.0" y="179.8">Flux estimator uses</text>
      <text x="400.0" y="203.5">the wrong resistive drop</text>
    </g>
    <rect x="220" y="260" width="360" height="70" fill="#ffffff" stroke="#111111" stroke-width="2"/>
    <g text-anchor="middle" font-size="19">
      <text x="400.0" y="301.6">Estimated flux drifts</text>
    </g>
    <rect x="220" y="370" width="360" height="70" fill="#ffffff" stroke="#111111" stroke-width="2"/>
    <g text-anchor="middle" font-size="19">
      <text x="400.0" y="399.8">Controller corrects</text>
      <text x="400.0" y="423.5">an error that is not real</text>
    </g>
    <rect x="220" y="480" width="360" height="70" fill="#ffffff" stroke="#111111" stroke-width="2"/>
    <g text-anchor="middle" font-size="19">
      <text x="400.0" y="521.6">Speed control lost</text>
    </g>
    <line x1="400" y1="110" x2="400" y2="150" stroke="#111111" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="400" y1="220" x2="400" y2="260" stroke="#111111" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="400" y1="330" x2="400" y2="370" stroke="#111111" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="400" y1="440" x2="400" y2="480" stroke="#111111" stroke-width="2" marker-end="url(#arrow)"/>

  </g>
</svg>
